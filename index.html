<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Risk exams</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&display=swap&subset=cyrillic,greek" rel="stylesheet">
<style>
:root{--paper:#F4F6F8;--surface:#FFFFFF;--ink:#15202B;--muted:#5B6775;--line:#DCE2E8;--line2:#ECEFF3;--navy:#1F3A5F;--navy-ink:#FFFFFF;--navy-soft:#E6EDF5;
--ok:#1E7A45;--ok-bg:#E3F2E9;--bad:#B4372C;--bad-bg:#FBE8E6;--amber:#8A5A00;--amber-bg:#FBEFD7;color-scheme:light;
--f:'Commissioner',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--paper:#0F141A;--surface:#161C24;--ink:#E4E9EF;--muted:#98A3B1;--line:#29323D;--line2:#1E252E;--navy:#9BBCE6;--navy-ink:#0F141A;--navy-soft:#1C2939;
--ok:#7FD3A0;--ok-bg:#173726;--bad:#F19A90;--bad-bg:#3D1E1B;--amber:#F2C56B;--amber-bg:#3A2D12;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--f);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:var(--navy)}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:6px}
h1{font-size:clamp(26px,4vw,34px);line-height:1.15;font-weight:600;letter-spacing:-.015em;margin:0 0 8px}
h2{font-size:18px;font-weight:600;margin:0 0 12px}
.muted{color:var(--muted)}.small{font-size:13px}.pad{padding:24px 0}.err{color:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:6px;font:500 15px/1 var(--f);padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}.btn.primary:hover{filter:brightness(1.08)}
.btn.big{font-size:17px;padding:14px 22px;border-radius:12px}.btn.sm{font-size:13px;padding:6px 10px;border-radius:8px}
.btn.danger{color:var(--bad)}.btn.danger:hover{border-color:var(--bad)}
.icon{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:15px;line-height:1}
.icon:disabled{opacity:.35;cursor:default}.icon.danger{color:var(--bad)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
textarea{resize:vertical;line-height:1.5}input:focus,textarea:focus,select:focus{outline:2px solid var(--navy);outline-offset:-1px;border-color:transparent}
input[type=checkbox],input[type=radio]{width:18px;height:18px;padding:0;accent-color:var(--navy);flex:none;margin:0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}

/* shell */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--paper)}
.top .in{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;margin-right:8px}.brand img{width:28px;height:28px;border-radius:50%}
.nav{display:flex;gap:4px;flex:1}.nav a{padding:7px 12px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px}
.nav a:hover{color:var(--ink)}.nav a[aria-current=page]{background:var(--navy-soft);color:var(--navy)}
.who{display:flex;align-items:center;gap:8px;position:relative;font-size:14px;color:var(--muted)}
.langmenu{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 30px rgba(15,25,40,.16);z-index:30;min-width:170px}
.langmenu button{display:flex;gap:10px;width:100%;padding:8px 10px;border:0;background:none;font:inherit;color:var(--ink);border-radius:8px;cursor:pointer;text-align:left}
.langmenu button:hover,.langmenu button[aria-checked=true]{background:var(--navy-soft)}.langmenu b{width:22px}
main{max-width:1080px;margin:0 auto;padding:28px 20px 120px}
.narrow{max-width:760px}

/* gate */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate .box{max-width:400px;text-align:left}.gate img{width:44px;height:44px;border-radius:50%;margin-bottom:18px}.gate p{color:var(--muted);margin:0 0 22px}

/* home */
.hero{padding:28px 0 32px;border-bottom:1px solid var(--line);margin-bottom:8px}
.kicker{color:var(--navy);font-weight:600;font-size:15px;margin:0 0 6px}
.lede{color:var(--muted);max-width:62ch;margin:0 0 14px;font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:6px 0;color:var(--muted);font-size:14px;margin:0 0 22px}
.meta span+span::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--muted);opacity:.5;vertical-align:middle;margin:0 12px}
.sec{font-size:15px;color:var(--muted);font-weight:600;margin:28px 0 8px}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rows li{border-bottom:1px solid var(--line)}
.rows a,.rowdiv{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:14px 4px;text-decoration:none;color:var(--ink)}
.rows a:hover b{color:var(--navy)}.rows .meta{margin:0;grid-column:1}.rows .tag{grid-row:1/3;grid-column:2;align-self:center}
.empty{padding:48px 0;max-width:52ch}.empty p{color:var(--muted)}.empty.soft{padding:24px 0}
.tag{display:inline-block;font-size:13px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--line2);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.amber{background:var(--amber-bg);color:var(--amber)}
.tag.st-open{background:var(--navy-soft);color:var(--navy)}

/* questions */
.takehead{margin-bottom:12px}.back{display:inline-block;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:14px}.back:hover{color:var(--ink)}
.note{background:var(--amber-bg);color:var(--amber);padding:10px 14px;border-radius:10px;font-size:14px;margin:0 0 16px}.note.okn{background:var(--ok-bg);color:var(--ok)}
.qlist{list-style:none;margin:0;padding:0}
.qlist>.q{position:relative;padding:24px 0 26px 64px;border-bottom:1px solid var(--line)}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.qlist:not(.edit) .qn{position:absolute;left:0;top:20px;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--navy);color:var(--navy);display:grid;place-items:center;font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.qpts{font-size:13px;color:var(--muted)}
.qtext{font-size:17px;font-weight:500;margin:0 0 4px;max-width:66ch}
.qhint{font-size:13px;color:var(--muted);margin:0 0 14px}
.opts{display:grid;gap:8px;max-width:620px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface);cursor:pointer}
.opt:hover{border-color:var(--muted)}.opt:has(input:checked){border-color:var(--navy);background:var(--navy-soft)}.opt input{margin-top:2px}
.ta{max-width:620px;min-height:120px}
.submitbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:16px;font-size:14px;color:var(--muted)}
.clock{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);padding:5px 10px;border-radius:8px;background:var(--line2)}.clock.low{background:var(--bad-bg);color:var(--bad)}

/* results */
.verdict{display:flex;gap:28px;align-items:center;padding:20px 0 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.big2{font-size:22px;font-weight:600;margin:0}
.stamp{--c:var(--navy);flex:none;width:132px;height:132px;border-radius:50%;border:3px solid var(--c);box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 7px var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--c);transform:rotate(-8deg);background:var(--surface)}
.stamp b{font-size:34px;line-height:1;font-weight:700;letter-spacing:-.02em}.stamp span{font-size:13px;font-weight:600;margin-top:4px;text-align:center;padding:0 10px;line-height:1.2}
.stamp.pass{--c:var(--ok)}.stamp.fail{--c:var(--bad)}.stamp.pend{--c:var(--amber)}
.mhead .stamp{width:92px;height:92px}.mhead .stamp b{font-size:24px}.mhead .stamp span{font-size:11px}
@media (prefers-reduced-motion:no-preference){.verdict .stamp{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}@keyframes stamp{from{transform:rotate(-8deg) scale(1.6);opacity:0}}}
.review .q.st-right .qn{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}.review .q.st-wrong .qn,.review .q.st-empty .qn{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.review .q.st-part .qn,.review .q.st-pending .qn{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.ropts{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;max-width:620px}
.ropts li{display:flex;gap:10px;align-items:baseline;padding:9px 12px;border-radius:10px;border:1px solid var(--line)}
.ropts .mark{width:16px;flex:none;font-weight:700}.ropts em{margin-left:auto;font-style:normal;font-size:12.5px;color:var(--muted);white-space:nowrap;padding-left:10px}
.ropts li.is-c{border-color:var(--ok);background:var(--ok-bg)}.ropts li.is-c .mark{color:var(--ok)}.ropts li.is-w{border-color:var(--bad);background:var(--bad-bg)}.ropts li.is-w .mark{color:var(--bad)}
.lbl{font-size:13px;color:var(--muted);font-weight:500;margin:14px 0 4px}
.answer{background:var(--line2);border-radius:10px;padding:10px 14px;max-width:620px;white-space:normal}.answer.model{background:var(--navy-soft)}.answer.note2{background:var(--amber-bg)}
.grade{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:12px;max-width:620px}.grade label{display:grid;gap:4px;font-size:13px;color:var(--muted)}.grade input[type=number]{width:80px}.grade .pin{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px}.grade .grow{flex:1;min-width:200px}

/* admin */
.pagehead{display:flex;align-items:flex-end;gap:12px 16px;flex-wrap:wrap;margin-bottom:20px}.pagehead .back{flex-basis:100%;margin:0}.pagehead h1{flex:1;margin:0;min-width:200px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.acts.end{justify-content:flex-end;margin-top:16px}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}.tbl th{text-align:left;font-size:13px;font-weight:500;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}.tbl tr:last-child td{border-bottom:0}.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.acts{display:table-cell;text-align:right;white-space:nowrap}.tbl td.acts>*{margin-left:6px}.tbl a{text-decoration:none}.tbl select{width:auto;padding:6px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.form h2,.form .full{grid-column:1/-1}
.form label,.q.card>label{display:grid;gap:5px;font-size:13.5px;color:var(--muted);font-weight:500}
.form label.check,.cbox{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14.5px}
.qlist.edit>.q.card{padding:16px 18px;border:1px solid var(--line);margin-bottom:12px;display:grid;gap:12px}
.qlist.edit .qhead{margin:0;flex-wrap:wrap}.qlist.edit .qn{width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;font-weight:600;font-size:14px}
.qlist.edit select{width:auto}.ptsin{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}.ptsin input{width:72px}.grow{flex:1}
.eopts{display:grid;gap:8px}.eopt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.cbox{min-width:92px}.cbox span{font-size:13px;color:var(--muted)}.eopts>.btn{justify-self:start}.cbox:has(input:checked) span{color:var(--ok);font-weight:600}
.addq{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 0;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 18px}.stats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stats b{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}.stats small{font-size:15px;color:var(--muted);font-weight:500}.stats span{font-size:13px;color:var(--muted)}
.qstats{margin:0;padding:0 0 0 22px;display:grid;gap:10px}.qstats li{display:grid;grid-template-columns:1fr 160px 90px;gap:14px;align-items:center;font-size:14.5px}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden}.bar i{display:block;height:100%;background:var(--muted)}.bar i.hi{background:var(--ok)}.bar i.mid{background:var(--amber)}.bar i.lo{background:var(--bad)}
.qs-n{font-size:13px;color:var(--muted);text-align:right}
.addp details{margin-top:4px}.addp summary{cursor:pointer;color:var(--navy);font-size:14px}.addp details textarea{margin:10px 0}
.addp>button{align-self:end}

/* modal & toast */
.modalbg{position:fixed;inset:0;z-index:40;background:rgba(10,15,22,.5);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;padding:22px 24px;width:100%;max-width:560px;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}.modal.wide{max-width:820px}
.modal .mhead{display:flex;align-items:center;gap:16px;justify-content:space-between;margin-bottom:4px}.modal .mhead h2{margin:0}
.modal .qlist>.q{padding-left:56px}.modal .qlist:not(.edit) .qn{width:38px;height:38px;font-size:15px}
.modal label.full{display:grid;gap:5px;font-size:13.5px;color:var(--muted);margin-top:16px}
.acts.sticky{position:sticky;bottom:-22px;background:var(--surface);padding:12px 0;margin-bottom:-12px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;max-width:min(560px,90vw)}

@media (max-width:640px){
  .top .in{gap:8px 12px}.nav{order:3;flex-basis:100%}.who #who{display:none}
  .qlist>.q{padding-left:0}.qlist:not(.edit) .qn{position:static;width:34px;height:34px;font-size:15px}.qlist:not(.edit) .qhead{margin-bottom:10px}
  .modal .qlist>.q{padding-left:0}
  .qstats li{grid-template-columns:1fr 70px}.qstats .bar{display:none}
  .verdict{gap:18px}.stamp{width:110px;height:110px}.stamp b{font-size:28px}
  .tbl td.acts{white-space:normal}.tbl td.acts>*{margin:3px 0 3px 6px}
}
</style>
</head>

// ---------- scoring (same on admin and agent side) ----------
function scoreOf(exam, key, sub, grade) {
  let got = 0, max = 0, pending = 0; const per = {};
  for (const q of exam.questions || []) {
    const p = +q.points || 1; max += p;
    const k = (key && key.q && key.q[q.id]) || {}, a = sub && sub.answers ? sub.answers[q.id] : undefined;
    if (q.type === 'text') {
      const g = grade && grade.text && grade.text[q.id];
      if (!a || !String(a).trim()) per[q.id] = { got: 0, max: p, state: 'empty' };
      else if (g && g.pts != null && g.pts !== '') { const v = Math.max(0, Math.min(p, +g.pts)); got += v; per[q.id] = { got: v, max: p, state: v >= p ? 'right' : v > 0 ? 'part' : 'wrong' }; }
      else { pending++; per[q.id] = { got: 0, max: p, state: 'pending' }; }
      continue;
    }
    const corr = new Set(k.correct || []), sel = new Set(Array.isArray(a) ? a : []);
    let v = 0;
    if (!sel.size) { per[q.id] = { got: 0, max: p, state: 'empty' }; continue; }
    const exact = sel.size === corr.size && [...sel].every(x => corr.has(x));
    if (exact) v = p;
    else if (q.type === 'multi' && exam.partial && corr.size) { const right = [...sel].filter(x => corr.has(x)).length, wrong = sel.size - right; v = round(Math.max(0, (right - wrong) / corr.size) * p); }
    got += v; per[q.id] = { got: v, max: p, state: v >= p ? 'right' : v > 0 ? 'part' : 'wrong' };
  }
  got = round(got);
  return { got, max, pending, per, pct: max ? Math.round(got / max * 100) : 0 };
}

const col = c => db.collection(c);
async function listMyExams() {
  const [ex, subs, atts] = await Promise.all([
    col('exams').where('status', 'in', ['open', 'closed']).get(),
    col('submissions').where('email', '==', me.email).get(),
    col('attempts').where('email', '==', me.email).get()
  ]);
  const S = {}, A = {};
  subs.forEach(d => { S[d.data().examId] = d.data(); }); atts.forEach(d => { A[d.data().examId] = d.data(); });
  const list = []; ex.forEach(d => list.push({ id: d.id, ...d.data() }));
  list.sort((a, b) => (toDate(b.updatedAt) || 0) - (toDate(a.updatedAt) || 0));
  return { list, S, A };
}

// ---------- routing ----------
function route() {
  const h = location.hash.slice(1) || 'home';
  const [view, id] = [h.split('-')[0], h.slice(h.indexOf('-') + 1)];
  document.querySelectorAll('.nav a').forEach(a => a.setAttribute('aria-current', a.dataset.v === (view === 'edit' || view === 'results' ? 'manage' : view === 'take' || view === 'result' ? 'home' : view) ? 'page' : 'false'));
  window.scrollTo(0, 0);
  stopTimer();
  const a = app(); a.oninput = a.onclick = a.onchange = null;
  if (!me) return;
  if (view === 'take') return viewTake(id);
  if (view === 'result') return viewResult(id);
  if (view === 'preview' && isAdmin()) return viewTake(id, true);
  if (view === 'manage' && isAdmin()) return viewManage();
  if (view === 'edit' && isAdmin()) return viewEdit(id);
  if (view === 'results' && isAdmin()) return viewResults(id);
  if (view === 'people' && isAdmin()) return viewPeople();
  return viewHome();
}

// ---------- agent: take exam ----------
let timer = null;
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
const draftKey = id => 'exam:draft:' + me.email + ':' + id;
function loadDraft(id) { try { return JSON.parse(localStorage.getItem(draftKey(id))) || {}; } catch (e) { return {}; } }
function saveDraft(id, a) { try { localStorage.setItem(draftKey(id), JSON.stringify(a)); } catch (e) {} }

async function viewTake(id, preview) {
  loading();
  try {
    const ed = await col('exams').doc(id).get();
    if (!ed.exists) throw new Error('Not found');
    const exam = { id, ...ed.data() };
    let attempt = null;
    if (!preview) {
      const sd = await col('submissions').doc(sid(id, me.email)).get();
      if (sd.exists) { go('result-' + id); return; }
      if (exam.status !== 'open') { app().innerHTML = `<section class="empty"><h1>${esc(exam.title)}</h1><p>${t('closedNow')}</p><a class="btn" href="#home">${t('back')}</a></section>`; return; }
      const ref = col('attempts').doc(sid(id, me.email));
      let ad = await ref.get();
      if (!ad.exists) { await ref.set({ examId: id, email: me.email, name: me.name, startedAt: firebase.firestore.FieldValue.serverTimestamp() }); ad = await ref.get(); }
      attempt = ad.data();
    }
    const answers = preview ? {} : loadDraft(id);
    const qs = exam.questions || [];
    let h = `<div class="takehead"><a class="back" href="${preview ? '#edit-' + id : '#home'}">← ${t('back')}</a><h1>${esc(exam.title || t('untitled'))}</h1>${exam.desc ? `<p class="lede">${nl(exam.desc)}</p>` : ''}${preview ? `<p class="note">${t('previewNote')}</p>` : ''}</div><ol class="qlist">`;
    qs.forEach((q, i) => {
      const a = answers[q.id];
      h += `<li class="q" data-q="${q.id}"><div class="qhead"><span class="qn">${i + 1}</span><span class="qpts">${pts(q.points || 1)}</span></div><p class="qtext">${nl(q.text)}</p><p class="qhint">${t(q.type)}</p>`;
      if (q.type === 'text') h += `<textarea class="ta" data-text="${q.id}" maxlength="${MAX_TEXT}" rows="5" placeholder="${esc(t('textPh'))}">${esc(a || '')}</textarea>`;
      else {
        h += '<div class="opts">';
        (q.options || []).forEach((o, j) => { const on = Array.isArray(a) && a.includes(j); h += `<label class="opt"><input type="${q.type === 'single' ? 'radio' : 'checkbox'}" name="q_${q.id}" value="${j}" ${on ? 'checked' : ''}><span>${nl(o)}</span></label>`; });
        h += '</div>';
      }
      h += '</li>';
    });
    h += `</ol><div class="submitbar"><span id="progress"></span><span id="clock" class="clock" hidden></span>${preview ? '' : `<button class="btn primary" id="submitBtn">${t('submit')}</button>`}</div>`;
    app().innerHTML = h;
    const answered = () => qs.filter(q => { const a = answers[q.id]; return q.type === 'text' ? a && String(a).trim() : Array.isArray(a) && a.length; }).length;
    const upd = () => { $('#progress').textContent = t('of', { a: answered(), b: qs.length }); };
    upd();
    app().oninput = e => {
      const q = e.target.closest('.q'); if (!q) return; const qid = q.dataset.q, Q = qs.find(x => x.id === qid);
      if (Q.type === 'text') answers[qid] = e.target.value.slice(0, MAX_TEXT);
      else answers[qid] = [...q.querySelectorAll('input:checked')].map(x => +x.value);
      if (!preview) saveDraft(id, answers); upd();
    };
    app().onclick = null;
    if (preview) return;
    let sending = false;
    const send = async (auto) => {
      if (sending) return;
      if (!auto) { const left = qs.length - answered(); if (!confirm(left ? t('submitQ2', { n: left }) : t('submitQ'))) return; }
      sending = true; $('#submitBtn').disabled = true; stopTimer();
      const clean = {};
      for (const q of qs) { const a = answers[q.id]; if (q.type === 'text') { if (a && String(a).trim()) clean[q.id] = String(a).slice(0, MAX_TEXT); } else if (Array.isArray(a) && a.length) clean[q.id] = a; }
      try {
        await col('submissions').doc(sid(id, me.email)).set({ examId: id, email: me.email, name: me.name, answers: clean, submittedAt: firebase.firestore.FieldValue.serverTimestamp() });
        try { localStorage.removeItem(draftKey(id)); } catch (e) {}

    };

      };
      tick(); timer = setInterval(tick, 1000);
    }

}

// ---------- agent: result ----------
function reviewHtml(exam, key, sub, grade, sc, editable) {
  let h = '<ol class="qlist review">';
  (exam.questions || []).forEach((q, i) => {
    const k = (key && key.q && key.q[q.id]) || {}, a = sub.answers ? sub.answers[q.id] : undefined, r = sc.per[q.id] || {};
    h += `<li class="q st-${r.state}"><div class="qhead"><span class="qn">${i + 1}</span><span class="qpts">${r.state === 'pending' ? t('pendingGrade') : round(r.got) + ' / ' + r.max}</span></div><p class="qtext">${nl(q.text)}</p>`;
    if (q.type === 'text') {
      h += `<p class="lbl">${editable ? t('theirAns') : t('yourAns')}</p><div class="answer">${a ? nl(a) : `<i>${t('noAnswer')}</i>`}</div>`;
      if (k.model) h += `<p class="lbl">${t('model')}</p><div class="answer model">${nl(k.model)}</div>`;
      const g = (grade && grade.text && grade.text[q.id]) || {};
      if (editable) h += `<div class="grade"><label>${t('points')}<span class="pin"><input type="number" min="0" max="${q.points || 1}" step="0.5" data-gp="${q.id}" value="${g.pts ?? ''}"> / ${q.points || 1}</span></label><label class="grow">${t('comment')}<input type="text" data-gc="${q.id}" value="${esc(g.comment || '')}"></label></div>`;
      else if (g.comment) h += `<p class="lbl">${t('reviewerNote')}</p><div class="answer note2">${nl(g.comment)}</div>`;
    } else {
      const corr = new Set(k.correct || []), sel = new Set(Array.isArray(a) ? a : []);
      h += '<ul class="ropts">';
      (q.options || []).forEach((o, j) => { const c = corr.has(j), s = sel.has(j); h += `<li class="${c ? 'is-c' : ''} ${s ? 'is-s' : ''} ${s && !c ? 'is-w' : ''}"><span class="mark">${s ? (c ? '✓' : '✗') : c ? '✓' : ''}</span><span>${nl(o)}</span>${s ? `<em>${editable ? t('chosen') : t('yourAns')}</em>` : c ? `<em>${t('correctAns')}</em>` : ''}</li>`; });
      h += '</ul>'; if (!sel.size) h += `<p class="muted small">${t('noAnswer')}</p>`;
    }
    if (k.explain) h += `<p class="lbl">${t('explain')}</p><div class="answer">${nl(k.explain)}</div>`;
    h += '</li>';
  });
  return h + '</ol>';
}
function stampHtml(exam, sc) {
  const pass = sc.pending ? null : sc.pct >= (exam.passMark ?? 80);
  return `<div class="stamp ${pass === null ? 'pend' : pass ? 'pass' : 'fail'}"><b>${sc.pct}%</b><span>${pass === null ? t('pending') : pass ? t('passed') : t('failed')}</span></div>`;
}

        }
      }
      return null;
    }
    async function save() {
      const err = validate(); if (err) { toast(err); return; }
      const qsOut = [], keyOut = {};
      for (const q of W.qs) {
        // drop empty options and remap the correct indexes
        let options = q.options, correct = q.correct;
        if (q.type !== 'text') { const keep = q.options.map((o, j) => o.trim() ? j : -1).filter(j => j >= 0); options = keep.map(j => q.options[j].trim()); correct = q.correct.map(c => keep.indexOf(c)).filter(c => c >= 0); }
        qsOut.push({ id: q.id, type: q.type, text: q.text.trim(), options: q.type === 'text' ? [] : options, points: +q.points || 1 });
        keyOut[q.id] = { correct: q.type === 'text' ? [] : correct, model: q.type === 'text' ? q.model : '', explain: q.explain };
      }
      const b = db.batch();
      b.update(col('exams').doc(id), { title: W.title.trim(), desc: W.desc.trim(), status: W.status, timeLimit: Math.max(0, Math.round(+W.timeLimit || 0)), passMark: Math.max(0, Math.min(100, +W.passMark || 0)), partial: W.partial, questions: qsOut, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      b.set(col('examKeys').doc(id), { q: keyOut });
      try { await b.commit(); dirty = false; toast(t('saved')); W.qs.forEach((q, i) => { q.options = qsOut[i].options; q.correct = keyOut[q.id].correct; }); draw(); } catch (e) { toast(t('saveFail', { e: e.message || e.code })); }
    }
    app().oninput = e => {
      const el = e.target;
      if (el.dataset.w) { const k = el.dataset.w; W[k] = el.type === 'checkbox' ? el.checked : el.value; if (k === 'title') document.querySelector('.pagehead h1').textContent = el.value || t('untitled'); dirty = true; return; }
      const li = el.closest('.q'); if (!li) return; const q = W.qs[+li.dataset.i];
      if (el.dataset.f === 'type') { q.type = el.value; if (q.type === 'text') { q.options = []; q.correct = []; } else { if (q.options.length < 2) q.options = ['', '']; if (q.type === 'single') q.correct = q.correct.slice(0, 1); } dirty = true; draw(); return; }
      if (el.dataset.f) q[el.dataset.f] = el.dataset.f === 'points' ? el.value : el.value;
      if (el.dataset.o != null) q.options[+el.dataset.o] = el.value;
      if (el.dataset.c != null) q.correct = q.type === 'single' ? [+el.dataset.c] : [...li.querySelectorAll('[data-c]:checked')].map(x => +x.dataset.c);
      dirty = true;
    };
    app().onclick = e => {
      const add = e.target.closest('[data-add]'); if (add) { W.qs.push(newQ(add.dataset.add)); dirty = true; draw(); const last = app().querySelector('.qlist.edit > li:last-child textarea'); last && last.focus(); return; }
      const b = e.target.closest('[data-a]'); if (!b) return; const li = b.closest('.q'), i = +li.dataset.i, q = W.qs[i];
      if (b.dataset.a === 'up' && i) [W.qs[i - 1], W.qs[i]] = [W.qs[i], W.qs[i - 1]];
      else if (b.dataset.a === 'down' && i < W.qs.length - 1) [W.qs[i + 1], W.qs[i]] = [W.qs[i], W.qs[i + 1]];
      else if (b.dataset.a === 'copy') W.qs.splice(i + 1, 0, { ...q, id: uid(), options: [...q.options], correct: [...q.correct] });
      else if (b.dataset.a === 'rm') W.qs.splice(i, 1);
      else if (b.dataset.a === 'addopt') q.options.push('');
      else if (b.dataset.a === 'rmopt') { const j = +b.dataset.j; q.options.splice(j, 1); q.correct = q.correct.filter(c => c !== j).map(c => c > j ? c - 1 : c); }
      else return;
      dirty = true; draw();
    };
    draw();
  } catch (e) { fail(e); }
}

// ---------- admin: results ----------
async function viewResults(id) {
  loading();
  try {
    const [ed, kd, us, ss, as, gs] = await Promise.all([col('exams').doc(id).get(), col('examKeys').doc(id).get(), col('examUsers').get(),
      col('submissions').where('examId', '==', id).get(), col('attempts').where('examId', '==', id).get(), col('grades').where('examId', '==', id).get()]);
    if (!ed.exists) throw new Error('Not found');
    const exam = { id, ...ed.data() }, key = kd.exists ? kd.data() : { q: {} };
    const S = {}, A = {}, G = {}, P = {};
    ss.forEach(d => { S[d.data().email] = d.data(); }); as.forEach(d => { A[d.data().email] = d.data(); }); gs.forEach(d => { G[d.data().email] = d.data(); });
    us.forEach(d => { P[d.id] = d.data(); });
    const emails = [...new Set([...Object.keys(P).filter(e => P[e].role !== 'admin' || S[e] || A[e]), ...Object.keys(S), ...Object.keys(A)])];
    const rows = emails.map(e => { const s = S[e]; const sc = s ? scoreOf(exam, key, s, G[e]) : null; return { e, name: (P[e] && P[e].name) || (s && s.name) || e, s, a: A[e], sc }; })
      .sort((x, y) => (y.s ? 1 : 0) - (x.s ? 1 : 0) || x.name.localeCompare(y.name));
    const subs = rows.filter(r => r.s), pend = subs.filter(r => r.sc.pending).length;
    const avg = subs.length ? Math.round(subs.reduce((a, r) => a + r.sc.pct, 0) / subs.length) : null;
    let h = `<div class="pagehead"><a class="back" href="#manage">← ${t('navManage')}</a><h1>${esc(exam.title || t('untitled'))}</h1>
      <div class="acts"><a class="btn" href="#edit-${id}">${t('edit')}</a><button class="btn" id="csvBtn">${t('exportCsv')}</button>
      ${exam.status === 'open' ? `<button class="btn" data-st="closed">${t('closeExam')}</button>` : `<button class="btn" data-st="open">${exam.status === 'closed' ? t('reopen') : t('openExam')}</button>`}
      <button class="btn ${exam.released ? '' : 'primary'}" id="relBtn">${exam.released ? t('releaseOff') : t('releaseOn')}</button></div></div>
      <p class="note ${exam.released ? 'okn' : ''}">${exam.released ? t('releasedNote') : t('hiddenNote')}</p>
      <div class="stats"><div><b>${subs.length}<small> / ${rows.length}</small></b><span>${t('subCount')}</span></div><div><b>${avg == null ? '–' : avg + '%'}</b><span>${t('avg')}</span></div><div><b>${pend}</b><span>${t('pendingCount')}</span></div></div>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>${t('thPerson')}</th><th>${t('thState')}</th><th class="num">${t('thScore')}</th><th></th></tr></thead><tbody>`;
    for (const r of rows) {
      const st = r.s ? (r.sc.pending ? `<span class="tag amber">${t('toGrade', { n: r.sc.pending })}</span>` : `<span class="tag ${r.sc.pct >= (exam.passMark ?? 80) ? 'ok' : 'bad'}">${r.sc.pct >= (exam.passMark ?? 80) ? t('passed') : t('failed')}</span>`) : r.a ? `<span class="tag amber">${t('inProgress')}</span>` : `<span class="tag">${t('notStarted')}</span>`;
      h += `<tr><td><b>${esc(r.name)}</b><br><span class="muted small">${esc(r.e)}${P[r.e] ? '' : ' · ' + t('notOnList')}</span></td><td>${st}</td><td class="num">${r.s ? `${r.sc.got} / ${r.sc.max}<br><span class="muted small">${r.sc.pct}%</span>` : ''}</td>
        <td class="acts">${r.s ? `<button class="btn sm" data-rev="${esc(r.e)}">${t('review')}</button>` : ''}${r.s || r.a ? `<button class="btn sm danger" data-reset="${esc(r.e)}">${t('reset')}</button>` : ''}</td></tr>`;
    }
    h += '</tbody></table></div>';
    // per-question stats
    if (subs.length && (exam.questions || []).length) {
      h += `<h2 class="sec">${t('perQ')}</h2><ol class="qstats">`;
      for (const q of exam.questions) {
        const vals = subs.map(r => r.sc.per[q.id]).filter(p => p && p.state !== 'pending');
        const pc = vals.length ? Math.round(vals.reduce((a, p) => a + p.got / p.max, 0) / vals.length * 100) : null;
        h += `<li><span class="qs-t">${esc(q.text.length > 140 ? q.text.slice(0, 140) + '…' : q.text)}</span><span class="bar"><i style="width:${pc ?? 0}%" class="${pc == null ? '' : pc < 50 ? 'lo' : pc < 80 ? 'mid' : 'hi'}"></i></span><span class="qs-n">${pc == null ? '–' : t('qCorrect', { n: pc })}</span></li>`;
      }
      h += '</ol>';
    }
    app().innerHTML = h;
    app().querySelectorAll('[data-st]').forEach(b => b.onclick = async () => { try { await col('exams').doc(id).update({ status: b.dataset.st, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); viewResults(id); } catch (e) { toast(t('saveFail', { e: e.message })); } });
    $('#relBtn').onclick = async () => { if (!exam.released && pend && !confirm(t('relPend', { n: pend }))) return; try { await col('exams').doc(id).update({ released: !exam.released }); viewResults(id); } catch (e) { toast(t('saveFail', { e: e.message })); } };
    $('#csvBtn').onclick = () => {
      const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
      const head = ['Name', 'Email', 'State', 'Points', 'Max', 'Percent', 'Pending', 'Submitted', ...exam.questions.map((x, i) => 'Q' + (i + 1))];
      const lines = [head.map(q).join(',')];
      for (const r of rows) lines.push([r.name, r.e, r.s ? (r.sc.pending ? 'to grade' : r.sc.pct >= (exam.passMark ?? 80) ? 'passed' : 'not passed') : r.a ? 'in progress' : 'not started', r.s ? r.sc.got : '', r.s ? r.sc.max : '', r.s ? r.sc.pct : '', r.s ? r.sc.pending : '', r.s ? fmtDate(r.s.submittedAt) : '', ...exam.questions.map(x => r.s ? (r.sc.per[x.id].state === 'pending' ? '?' : r.sc.per[x.id].got) : '')].map(q).join(','));
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv' })); a.download = (exam.title || 'exam').replace(/[^\w\-]+/g, '_') + '_results.csv'; a.click();
    };
    app().onclick = async e => {
      const rv = e.target.closest('[data-rev]'), rs = e.target.closest('[data-reset]');
      if (rs) {
        const em = rs.dataset.reset, r = rows.find(x => x.e === em);
        if (!confirm(t('resetQ', { name: r.name }))) return;
        try { const b = db.batch(); for (const c of ['submissions', 'attempts', 'grades']) b.delete(col(c).doc(sid(id, em))); await b.commit(); toast(t('resetDone')); viewResults(id); } catch (err) { toast(t('saveFail', { e: err.message })); }
      }
      if (rv) {
        const em = rv.dataset.rev, r = rows.find(x => x.e === em), g = G[em] || { text: {} };
        modal(`<div class="mhead"><h2>${esc(r.name)}</h2>${stampHtml(exam, r.sc)}</div>${reviewHtml(exam, key, r.s, g, r.sc, true)}
          <label class="full">${t('overall')}<textarea id="gOverall" rows="2">${esc(g.comment || '')}</textarea></label><div class="acts end sticky"><button class="btn" data-close>${t('close')}</button><button class="btn primary" id="gSave">${t('saveGrade')}</button></div>`, true);
        $('#gSave').onclick = async () => {
          const text = {};
          document.querySelectorAll('#modal [data-gp]').forEach(i => { const qid = i.dataset.gp, c = document.querySelector(`#modal [data-gc="${qid}"]`); text[qid] = { pts: i.value === '' ? null : +i.value, comment: c ? c.value.trim() : '' }; });
          try { await col('grades').doc(sid(id, em)).set({ examId: id, email: em, text, comment: $('#gOverall').value.trim(), by: me.email, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); toast(t('gradeSaved')); closeModal(); viewResults(id); }
          catch (err) { toast(t('saveFail', { e: err.message })); }
        };
      }
    };
  } catch (e) { fail(e); }
}

// ---------- admin: people ----------
async function viewPeople() {
  loading();
  try {
    const us = await col('examUsers').get();
    const list = []; us.forEach(d => list.push({ email: d.id, ...d.data() }));
    list.sort((a, b) => (a.role === 'admin' ? 0 : 1) - (b.role === 'admin' ? 0 : 1) || (a.name || a.email).localeCompare(b.name || b.email));
    let h = `<div class="pagehead"><h1>${t('navPeople')}</h1></div><p class="muted">${t('peopleNote')}</p>
      <section class="card form addp"><h2>${t('addPerson')}</h2><label>${t('name')}<input id="pName"></label><label>${t('email')}<input id="pEmail" type="email"></label>
      <label>${t('role')}<select id="pRole"><option value="agent">${t('r_agent')}</option><option value="admin">${t('r_admin')}</option></select></label><button class="btn primary" id="pAdd">${t('addPerson')}</button>
      <details class="full"><summary>${t('bulk')}</summary><textarea id="pBulk" rows="5" placeholder="Maria Ivanova, mivanova@betty.ca"></textarea><button class="btn" id="pBulkDo">${t('bulkDo')}</button></details></section>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>${t('name')}</th><th>${t('email')}</th><th>${t('role')}</th><th></th></tr></thead><tbody>`;
    for (const p of list) {
      const own = p.email === OWNER;
      h += `<tr><td><b>${esc(p.name || '')}</b>${p.email === me.email ? ` <span class="muted small">(${t('you')})</span>` : ''}</td><td>${esc(p.email)}</td>
        <td>${own ? t('owner') : `<select data-role="${esc(p.email)}"><option value="agent" ${p.role !== 'admin' ? 'selected' : ''}>${t('r_agent')}</option><option value="admin" ${p.role === 'admin' ? 'selected' : ''}>${t('r_admin')}</option></select>`}</td>
        <td class="acts">${own ? '' : `<button class="btn sm danger" data-rm="${esc(p.email)}">${t('remove')}</button>`}</td></tr>`;
    }
    h += '</tbody></table></div>';
    app().innerHTML = h;
    const valid = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
    const addMany = async items => {
      for (const it of items) if (!valid(it.email)) { toast(t('badEmail', { e: it.email })); return; }
      try { const b = db.batch(); items.forEach(it => b.set(col('examUsers').doc(it.email), { name: it.name, role: it.role, addedBy: me.email }, { merge: true })); await b.commit(); toast(t('added', { n: items.length })); viewPeople(); }
      catch (e) { toast(t('saveFail', { e: e.message })); }
    };
    $('#pAdd').onclick = () => { const email = $('#pEmail').value.trim().toLowerCase(); if (!email) return; addMany([{ name: $('#pName').value.trim(), email, role: $('#pRole').value }]); };
    $('#pBulkDo').onclick = () => {
      const items = $('#pBulk').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const m = l.match(/^(.*?)[,;\t]\s*(\S+@\S+)$/) || [null, '', l]; return { name: m[1].trim(), email: m[2].trim().toLowerCase(), role: 'agent' }; });
      if (items.length) addMany(items);
    };
    app().onchange = async e => { const s = e.target.closest('[data-role]'); if (!s) return; try { await col('examUsers').doc(s.dataset.role).update({ role: s.value }); toast(t('saved')); } catch (err) { toast(t('saveFail', { e: err.message })); } };
    app().onclick = async e => {
      const b = e.target.closest('[data-rm]'); if (!b) return; const p = list.find(x => x.email === b.dataset.rm);
      if (!confirm(t('removeQ', { name: p.name || p.email }))) return;
      try { await col('examUsers').doc(p.email).delete(); viewPeople(); } catch (err) { toast(t('saveFail', { e: err.message })); }
    };
  } catch (e) { fail(e); }
}

// ---------- modal ----------
let modalReturn = null;
function modal(html, wide) {
  modalReturn = document.activeElement;
  const bg = $('#modalbg'); $('#modal').innerHTML = html; $('#modal').classList.toggle('wide', !!wide); bg.hidden = false;
  const f = $('#modal').querySelector('textarea,input,button'); f && f.focus();
}
function closeModal() { $('#modalbg').hidden = true; $('#modal').innerHTML = ''; modalReturn && modalReturn.focus && modalReturn.focus(); }
document.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target.id === 'modalbg') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modalbg').hidden) closeModal(); });

// ---------- shell: language, nav, auth ----------
function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.title = t('app');
  $('#langBtn').textContent = DICT[LANG]._short;
}
$('#langBtn').addEventListener('click', e => {
  e.stopPropagation(); const old = $('.langmenu'); if (old) { old.remove(); return; }
  const m = document.createElement('div'); m.className = 'langmenu'; m.setAttribute('role', 'menu');
  m.innerHTML = Object.keys(DICT).map(k => `<button role="menuitemradio" aria-checked="${k === LANG}" data-l="${k}"><b>${DICT[k]._short}</b>${DICT[k]._name}</button>`).join('');
  e.currentTarget.parentElement.appendChild(m); m.querySelector('button').focus();
  m.addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; if (dirty && !confirm(t('unsaved'))) return; dirty = false; LANG = b.dataset.l; try { localStorage.setItem('exam:lang', LANG); } catch (er) {} m.remove(); applyLang(); route(); });
});
document.addEventListener('click', e => { const m = $('.langmenu'); if (m && !m.contains(e.target)) m.remove(); });
applyLang();

function gate(msg) { $('#gate').hidden = false; $('#shell').hidden = true; $('#gatemsg').textContent = msg || t('gateP'); }
(function init() {
  if (!window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey || /PASTE/.test(window.FIREBASE_CONFIG.apiKey)) { gate(t('noCfg')); return; }
  firebase.initializeApp(window.FIREBASE_CONFIG);
  auth = firebase.auth(); db = firebase.firestore();
  $('#login').addEventListener('click', () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => gate(t('signInFail', { e: e.message }))));
  $('#logout').addEventListener('click', () => { if (dirty && !confirm(t('unsaved'))) return; dirty = false; auth.signOut(); });
  auth.onAuthStateChanged(async u => {
    if (!u) { me = null; gate(); return; }
    const email = (u.email || '').toLowerCase();
    try {
      const ref = col('examUsers').doc(email); let d = await ref.get();
      if (!d.exists && email === OWNER) { await ref.set({ name: u.displayName || 'Denis', role: 'admin' }); d = await ref.get(); }
      if (!d.exists) { gate(t('noAccess', { email })); $('#login').hidden = true; $('#gateOut').hidden = false; return; }
      const data = d.data();
      me = { email, name: data.name || u.displayName || email, role: email === OWNER ? 'admin' : data.role === 'admin' ? 'admin' : 'agent' };
    } catch (e) { gate(t('noAccess', { email })); $('#login').hidden = true; $('#gateOut').hidden = false; return; }
    $('#gate').hidden = true; $('#shell').hidden = false; $('#who').textContent = me.name;
    document.querySelectorAll('.adminonly').forEach(x => { x.hidden = !isAdmin(); });
    route();
  });
  $('#gateOut').addEventListener('click', () => auth.signOut().then(() => { $('#login').hidden = false; $('#gateOut').hidden = true; gate(); }));
})();

</script>
